name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_DB: nettiauto_storage_fixture_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nettiauto_storage_fixture_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nettiauto_storage_fixture_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nettiauto_storage_fixture_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun --cwd packages/db migrate
      - run: bun run test
      - run: bun run typecheck:packages
      - run: bun run typecheck:web
      - run: bun run typecheck:api
      - run: bun run typecheck:worker
      - run: bun --cwd apps/web lint
      - run: bun run build:web
      - run: node scripts/verify-crawler-http.mjs
      - run: bun run build:api
      - run: bun run build:worker
