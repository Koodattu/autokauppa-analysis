services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - hero_images:/srv/hero-images:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://api:3001
      NEXT_PUBLIC_API_BASE_PATH: /api
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
      CRAWLER_PAUSED: ${CRAWLER_PAUSED:-false}
      CRAWLER_DELAY_MS: ${CRAWLER_DELAY_MS:-2500}
      CRAWLER_DELAY_JITTER_MS: ${CRAWLER_DELAY_JITTER_MS:-1000}
      CRAWLER_REQUEST_TIMEOUT_MS: ${CRAWLER_REQUEST_TIMEOUT_MS:-30000}
      CRAWLER_MAX_PAGES_PER_RUN: ${CRAWLER_MAX_PAGES_PER_RUN:-2}
      CRAWLER_BLOCK_PAUSE_MS: ${CRAWLER_BLOCK_PAUSE_MS:-21600000}
      CRAWLER_DETAIL_ENABLED: ${CRAWLER_DETAIL_ENABLED:-false}
      CRAWLER_DETAIL_MAX_PER_RUN: ${CRAWLER_DETAIL_MAX_PER_RUN:-50}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "--eval", "fetch('http://localhost:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
      CRAWLER_PAUSED: ${CRAWLER_PAUSED:-false}
      CRAWLER_DELAY_MS: ${CRAWLER_DELAY_MS:-2500}
      CRAWLER_DELAY_JITTER_MS: ${CRAWLER_DELAY_JITTER_MS:-1000}
      CRAWLER_REQUEST_TIMEOUT_MS: ${CRAWLER_REQUEST_TIMEOUT_MS:-30000}
      CRAWLER_MAX_PAGES_PER_RUN: ${CRAWLER_MAX_PAGES_PER_RUN:-2}
      CRAWLER_BLOCK_PAUSE_MS: ${CRAWLER_BLOCK_PAUSE_MS:-21600000}
      CRAWLER_DETAIL_ENABLED: ${CRAWLER_DETAIL_ENABLED:-false}
      CRAWLER_DETAIL_MAX_PER_RUN: ${CRAWLER_DETAIL_MAX_PER_RUN:-50}
      NETTIAUTO_SOURCE_TRANSPORT: ${NETTIAUTO_SOURCE_TRANSPORT:-impit}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      FLARESOLVERR_SESSION_ID: ${FLARESOLVERR_SESSION_ID:-nettiauto-worker}
      FLARESOLVERR_SESSION_TTL_MINUTES: ${FLARESOLVERR_SESSION_TTL_MINUTES:-30}
      DETAIL_BACKFILL_BATCH_SIZE: ${DETAIL_BACKFILL_BATCH_SIZE:-200}
      DETAIL_BACKFILL_TARGET_LIMIT: ${DETAIL_BACKFILL_TARGET_LIMIT:-200}
      HERO_IMAGE_ARCHIVE_ENABLED: ${HERO_IMAGE_ARCHIVE_ENABLED:-true}
      HERO_IMAGE_STORAGE_PATH: ${HERO_IMAGE_STORAGE_PATH:-/data/hero-images}
      HERO_IMAGE_MAX_SOURCE_BYTES: ${HERO_IMAGE_MAX_SOURCE_BYTES:-20971520}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hero_images:/data/hero-images
    healthcheck:
      test: ["CMD", "bun", "--eval", "const { Client } = require('pg'); const client = new Client({ connectionString: process.env.DATABASE_URL }); client.connect().then(() => client.query('select 1')).then(() => client.end()).then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      DISABLE_MEDIA: "true"
      HEADLESS: "true"
      TZ: Europe/Helsinki
    ports:
      - "127.0.0.1:${FLARESOLVERR_PORT:-8191}:8191"
    shm_size: 512mb
    mem_limit: ${FLARESOLVERR_MEMORY_LIMIT:-1g}
    cpus: ${FLARESOLVERR_CPUS:-1.0}
    pids_limit: 256
    volumes:
      - flaresolverr_config:/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOW_EMPTY_MIGRATIONS: ${ALLOW_EMPTY_MIGRATIONS:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nettiauto_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-nettiauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  hero_images:
  flaresolverr_config:
